[project]
name = "emap-backend"
version = "0.0.1"
description = "Northern European Electricity Balance Terminal — ingestion, analytics and API (service B)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "duckdb>=1.1",
  "pytz>=2024.1",          # required by duckdb for TIMESTAMPTZ <-> python datetime
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",           # fastapi TestClient
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["emap*"]

[tool.setuptools.package-data]
"emap.store" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
