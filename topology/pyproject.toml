[project]
name = "emap-topology"
version = "0.0.1"
description = "Service A — offline PyPSA-Eur topology export -> artifacts/topology.json"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "shapely>=2.0",
  "scikit-learn>=1.4",
  "pypsa>=0.30",           # native k-means busmap (same routine PyPSA-Eur clusters with)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["emap_topology*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
